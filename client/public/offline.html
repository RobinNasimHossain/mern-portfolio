<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Robin Nasim Hossain</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          Segoe UI,
          sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2rem;
        color: #14b8a6;
      }
      p {
        margin: 0 0 1.25rem;
        color: #94a3b8;
        max-width: 28rem;
      }
      button {
        appearance: none;
        background: #14b8a6;
        color: #0f172a;
        border: 0;
        padding: 0.65rem 1.25rem;
        border-radius: 0.5rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #0d9488;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        This page isn't cached yet. Reconnect to the internet and try again —
        the portfolio site works fully online.
      </p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
